{% extends "base.html" %}

{% block title %}Admin Login - Placement Portal{% endblock %}

{% block main_content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="text-center mb-5">
            <div class="mb-3 text-primary">
                <i class="fas fa-user-shield fa-3x"></i>
            </div>
            <h2 class="fw-bold text-primary">Admin Access</h2>
            <p class="text-muted">Enter administrative credentials to proceed.</p>
        </div>

        <form method="POST" action="{{ url_for('admin_login') }}">
            <div class="mb-3">
                <label class="form-label fw-semibold">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0"><i class="fas fa-user text-muted"></i></span>
                    <input type="text" name="username" class="form-control border-start-0 ps-0" placeholder="admin_user" required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0"><i class="fas fa-lock text-muted"></i></span>
                    <input type="password" name="password" class="form-control border-start-0 ps-0" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 mb-4">
                Secure Login
            </button>
        </form>

        <hr class="my-4 text-muted opacity-25">
        
        <div class="text-center">
            <a href="{{ url_for('home') }}" class="text-muted text-decoration-none small">
                <i class="fas fa-arrow-left me-1"></i> Back to Homepage
            </a>
        </div>
    </div>
</div>
{% endblock %}
