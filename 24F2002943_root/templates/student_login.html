{% extends "base.html" %}

{% block title %}Student Login - Placement Portal{% endblock %}

{% block main_content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="text-center mb-5">
            <h2 class="fw-bold text-primary">Student Login</h2>
            <p class="text-muted">Welcome back! Please enter your details.</p>
        </div>

        <form method="POST" action="{{ url_for('student_login') }}">
            <div class="mb-3">
                <label class="form-label fw-semibold">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0"><i class="fas fa-envelope text-muted"></i></span>
                    <input type="email" name="email" class="form-control border-start-0 ps-0" placeholder="name@example.com" required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0"><i class="fas fa-lock text-muted"></i></span>
                    <input type="password" name="password" class="form-control border-start-0 ps-0" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 mb-4">
                Sign In
            </button>
        </form>

        <div class="text-center pt-2">
            <p class="mb-1 text-muted">Don't have an account?</p>
            <a href="{{ url_for('student_register') }}" class="text-primary fw-bold text-decoration-none">Create a student account</a>
        </div>
        
        <hr class="my-4 text-muted opacity-25">
        
        <div class="text-center">
            <a href="{{ url_for('home') }}" class="text-muted text-decoration-none small">
                <i class="fas fa-arrow-left me-1"></i> Back to Homepage
            </a>
        </div>
    </div>
</div>
{% endblock %}
