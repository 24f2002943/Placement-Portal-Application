{% extends "base.html" %}

{% block title %}Student Registration - Placement Portal{% endblock %}

{% block main_content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="text-center mb-5">
            <h2 class="fw-bold text-primary">Student Registration</h2>
            <p class="text-muted">Join the portal to explore career opportunities.</p>
        </div>

        <form method="POST">
            <div class="mb-3">
                <label class="form-label fw-semibold">Full Name</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0"><i class="fas fa-user text-muted"></i></span>
                    <input type="text" name="full_name" class="form-control border-start-0 ps-0" placeholder="John Doe" required minlength="3" maxlength="50" pattern="[A-Za-z\s]+" title="Only letters and spaces allowed">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0"><i class="fas fa-envelope text-muted"></i></span>
                    <input type="email" name="email" class="form-control border-start-0 ps-0" placeholder="john@example.com" required maxlength="100">
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold">Create Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0"><i class="fas fa-lock text-muted"></i></span>
                    <input type="password" name="password" class="form-control border-start-0 ps-0" placeholder="min. 6 characters" required 
                           pattern="(?=.*[A-Z])(?=.*\d)(?=.*[\W_]).{6,}" 
                           title="Password must be at least 6 characters, include 1 uppercase letter, 1 number, and 1 special character.">
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 mb-4">
                Register Account
            </button>
        </form>

        <div class="text-center pt-2">
            <p class="mb-1 text-muted">Already have an account?</p>
            <a href="{{ url_for('student_login') }}" class="text-primary fw-bold text-decoration-none">Sign in here</a>
        </div>
        
        <hr class="my-4 text-muted opacity-25">
        
        <div class="text-center">
            <a href="{{ url_for('home') }}" class="text-muted text-decoration-none small">
                <i class="fas fa-arrow-left me-1"></i> Back to Homepage
            </a>
        </div>
    </div>
</div>
{% endblock %}
