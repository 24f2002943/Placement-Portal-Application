<!DOCTYPE html>
<html>
<head>
    <title>Available Jobs</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        .job-container {
            max-width: 900px;
            margin: auto;
        }

        .job-card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0px 2px 8px rgba(0,0,0,0.1);
        }

        .job-card h3 {
            margin-top: 0;
            color: #007bff;
        }

        .job-info {
            margin: 5px 0;
            color: #555;
        }

        .apply-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 14px;
            background-color: #28a745;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: 0.3s;
        }

        .apply-btn:hover {
            background-color: #218838;
        }

        .no-jobs {
            text-align: center;
            color: #777;
            margin-top: 50px;
        }
    </style>
</head>
<body>

<h2>Available Job Opportunities</h2>

<div class="job-container">

    {% if jobs %}
        {% for job in jobs %}
            <div class="job-card">
                <h3>{{ job[2] }}</h3>
                <p class="job-info"><strong>Company:</strong> {{ job[1] }}</p>
                <p class="job-info"><strong>Location:</strong> {{ job[3] }}</p>
                <p class="job-info"><strong>CTC:</strong> {{ job[4] }}</p>
                <p class="job-info"><strong>Deadline:</strong> {{ job[5] }}</p>

                <a class="apply-btn" href="/student/apply/{{ job[0] }}">
                    Apply Now
                </a>
            </div>
        {% endfor %}
    {% else %}
        <div class="no-jobs">
            <h3>No job opportunities available at the moment.</h3>
        </div>
    {% endif %}

</div>

</body>
</html>
