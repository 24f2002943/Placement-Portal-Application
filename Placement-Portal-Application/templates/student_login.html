<!DOCTYPE html>
<html>
<head>

<title>Student Login</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

/* Background image */

body{
background:url("{{ url_for('static', filename='images/student_dashboard.jpg') }}");
background-size:cover;
background-position:center;
background-repeat:no-repeat;
margin:0;
}

/* Dark overlay */

body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
z-index:-1;
}

/* Center layout */

.login-wrapper{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

/* Portal headline */

.portal-title{
color:white;
font-size:40px;
font-weight:700;
letter-spacing:1px;
margin-bottom:25px;
text-align:center;
}

/* Login card */

.login-box{
width:420px;
background:white;
padding:40px;
border-radius:12px;
box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

.login-box h2{
text-align:center;
margin-bottom:25px;
}

/* Login button */

.btn-login{
width:100%;
}

/* Links */

.links{
text-align:center;
margin-top:18px;
}

.links a{
text-decoration:none;
}

</style>

</head>

<body>

<div class="login-wrapper">

<h1 class="portal-title">
Placement Portal Application
</h1>

<div class="login-box">

<h2>Student Login</h2>

<!-- Flash Messages -->

{% with messages = get_flashed_messages() %}
{% if messages %}

<div class="alert alert-danger text-center">

{% for message in messages %}
{{ message }}
{% endfor %}

</div>

{% endif %}
{% endwith %}

<form method="POST" action="{{ url_for('student_login') }}">

<div class="mb-3">

<label class="form-label">Email</label>

<input
type="email"
name="email"
class="form-control"
placeholder="Enter email"
required>

</div>


<div class="mb-3">

<label class="form-label">Password</label>

<input
type="password"
name="password"
class="form-control"
placeholder="Enter password"
required>

</div>


<button type="submit" class="btn btn-primary btn-login">
Login
</button>

</form>


<div class="links">

<a href="{{ url_for('student_register') }}">
New Student? Register
</a>

<br><br>

<a href="{{ url_for('home') }}">
Back to Home
</a>

</div>

</div>

</div>

</body>
</html>
