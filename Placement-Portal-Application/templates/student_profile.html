<!DOCTYPE html>
<html>
<head>
    <title>Student Profile</title>
</head>
<body>

<h2>Student Profile</h2>

<form method="POST" enctype="multipart/form-data">

    <h3>Basic Information</h3>

    <label>Full Name:</label><br>
    <input type="text" name="full_name"
           value="{{ student['full_name'] }}" required><br><br>

    <label>Email (cannot change):</label><br>
    <input type="email"
           value="{{ student['email'] }}" disabled><br><br>

    <label>Phone:</label><br>
    <input type="text" name="phone"
           value="{{ student['phone'] or '' }}"><br><br>

    <h3>Academic Information</h3>

    <label>Degree:</label><br>
    <input type="text" name="degree"
           value="{{ student['degree'] or '' }}"><br><br>

    <label>Branch:</label><br>
    <input type="text" name="branch"
           value="{{ student['branch'] or '' }}"><br><br>

    <label>College:</label><br>
    <input type="text" name="college"
           value="{{ student['college'] or '' }}"><br><br>

    <label>CGPA:</label><br>
    <input type="number" step="0.01" name="cgpa"
           value="{{ student['cgpa'] or '' }}"><br><br>

    <h3>Professional Information</h3>

    <label>Skills:</label><br>
    <textarea name="skills"
              rows="4">{{ student['skills'] or '' }}</textarea><br><br>

    <h3>Resume</h3>

<label>Upload / Update Resume:</label><br>
<input type="file" name="resume"><br><br>

{% if student['resume_path'] %}
<p>
<strong>Current Resume:</strong>
<a href="{{ url_for('static', filename='uploads/' + student['resume_path']) }}" target="_blank">
    View Resume
</a>
</p>
{% else %}
<p><strong>No resume uploaded yet.</strong></p>
{% endif %}

<button type="submit">Save Profile</button>

</form>

<br>
<a href="{{ url_for('student_dashboard') }}">Back to Dashboard</a>

</body>
</html>
