<!DOCTYPE html>
<html>
<head>
    <title>Admin - Companies</title>
</head>
<body>
    <h2>Registered Companies</h2>

    <table border="1">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Approval Status</th>
        </tr>

        {% for company in companies %}
        <tr>
            <td>{{ company[0] }}</td>
            <td>{{ company[1] }}</td>
            <td>{{ company[2] }}</td>
            <td>{{ company[3] }}</td>
        </tr>
        {% endfor %}

    </table>
</body>
</html>
